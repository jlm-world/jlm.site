<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Lawrence Missal - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="card hero">
            <h1 id="site-name"></h1>
            <p class="sub" id="site-bio"></p>
            <div class="btns">
                <a class="btn" id="github-btn" target="_blank"></a>
                <a class="btn2" id="resume-btn" target="_blank"></a>
            </div>
        </div>

        <div class="card skills">
            <div class="label" id="skills-label"></div>
            <div id="skills-box"></div>
        </div>

        <div class="card exp">
            <div class="label" id="exp-label"></div>
            <div id="exp-box"></div>
        </div>

        <div class="card proj">
            <div class="label" id="proj-label"></div>
            <div id="proj-box"></div>
        </div>

        <div class="card contact">
            <div class="label" id="contact-label"></div>
            <div id="socials-box"></div>
            <p class="connect" id="connect-text"></p>
            <img class="connect-gif" id="connect-gif" alt="【entity-Hello Kitty¦canonical_name=Hello Kitty】">
        </div>
    </div>

    <script src="text.js"></script>
    <script src="script.js"></script>
</body>
</html>
